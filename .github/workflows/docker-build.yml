name: docker-build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Upstream pin — single source of truth for the base image ref.
  # Bump via the SOP-005-style pin-bump procedure (record commit sha below
  # in the release notes; the workflow logs the resolved sha at build time).
  OMP_UPSTREAM_REF: v18.16.0
  REGISTRY: ghcr.io
  IMAGE_NAME: profbernardoj/omp-hosted

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout omp-hosted
        uses: actions/checkout@v4

      - name: Clone pinned upstream (can1357/oh-my-pi)
        run: |
          set -eux
          git clone --depth 1 --branch "$OMP_UPSTREAM_REF" https://github.com/can1357/oh-my-pi.git upstream/
          cd upstream
          echo "OMP_UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD

      - name: Build upstream pi-runtime (local tag)
        run: docker build -t oh-my-pi/pi:"$OMP_UPSTREAM_REF" upstream/

      - name: Build omp-hosted
        run: |
          set -eux
          TAG="$(date -u +%Y.%m.%d.%H%M)"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          docker build \
            --build-arg OMP_UPSTREAM=oh-my-pi/pi:"$OMP_UPSTREAM_REF" \
            -t "$REGISTRY/$IMAGE_NAME:$TAG" .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          set -eux
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" 2>/dev/null || true)"
          {
            echo "### Image"
            echo "\`$REGISTRY/$IMAGE_NAME:$IMAGE_TAG\`"
            echo ""
            echo "- Upstream pin: \`$OMP_UPSTREAM_REF\` (commit \`$OMP_UPSTREAM_SHA\`)"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # F3 (Stage 2 R1): publish the exact calver tag this run pushed, so the
      # smoke-boot workflow_run can smoke THIS image instead of "newest tag in
      # GHCR" (which would let an older image green-check a broken commit).
      - name: Publish image tag for smoke
        run: |
          set -eux
          mkdir -p /tmp/omp-tag
          echo "$IMAGE_TAG" > /tmp/omp-tag/image-tag.txt
          cat /tmp/omp-tag/image-tag.txt
      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: /tmp/omp-tag/image-tag.txt
          if-no-files-found: error

      # SOP-004 hard rule: NEVER build or run Hermes/OMP images locally on
      # the Mac mini — this GHCR image is the ONLY artifact consumers use.
